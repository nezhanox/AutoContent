# .env's DB_HOST/DB_PORT/REDIS_HOST/REDIS_PORT point at the *host-mapped*
# ports (127.0.0.1:15432/16379) so `php artisan test`/tinker/etc. run
# directly on the host can reach postgres/redis. Containers on the compose
# network must instead reach them by service name on their container ports,
# so app/worker/horizon override those four vars below.
x-container-db-redis: &container-db-redis
  DB_HOST: postgres
  DB_PORT: 5432
  REDIS_HOST: redis
  REDIS_PORT: 6379

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    env_file: .env
    environment:
      <<: *container-db-redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HOST_PORT:-8090}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-autocontent}
      POSTGRES_USER: ${DB_USERNAME:-autocontent}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-autocontent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-autocontent}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    volumes:
      - .:/var/www/html
      - whisper_models:/root/.cache/huggingface
    env_file: .env
    environment:
      <<: *container-db-redis
      # .env's WHISPER_PYTHON_BINARY is a host-only .venv-whisper path (for
      # running whisper directly on the Mac). The worker image installs
      # faster-whisper into its own system python3 instead — no venv there.
      WHISPER_PYTHON_BINARY: python3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan horizon
    volumes:
      - .:/var/www/html
    env_file: .env
    environment:
      <<: *container-db-redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  whisper_models:
